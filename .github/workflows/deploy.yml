# Build the Next.js static export and deploy it to GitHub Pages.
#
# Setup (one-time, in your GitHub repo):
#   1. Push this project to a GitHub repo.
#   2. Repo Settings → Pages → Build and deployment → Source = "GitHub Actions".
#   3. Push to main (or run this workflow manually) — your site goes live at
#      https://<your-username>.github.io/<repo-name>/
#
# If your repo is named "<your-username>.github.io" (user page), the site
# goes live at https://<your-username>.github.io/ with no sub-path.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # If this is a PROJECT page (repo name != <user>.github.io), set
      # the base path so assets load from /<repo-name>/.
      - name: Compute base path
        id: basepath
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.base }}
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
